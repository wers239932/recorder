spring:
  application:
    name: recorder-server
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/recorder-db;AUTO_SERVER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  
  # Flyway миграции
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# Конфигурация сервера
server:
  port: 8080
  address: 0.0.0.0

# Настройки хранилища файлов
recorder:
  flyway:
    auto-repair-on-startup: true
  storage:
    path: /Users/ki.a.kuznetsov/IdeaProjects/recorder/server/recordings
    max-file-size: 104857600  # 100MB

# Интеграция с сервисом суммаризации
summary:
  client:
    # URL сервиса суммаризации (заменить на актуальный)
    base-url: ${SUMMARY_SERVICE_URL:http://localhost:8081}
    # Таймаут запроса
    timeout: 30s
    # API ключ (если требуется)
    api-key: ${SUMMARY_API_KEY:}
    # Включить автоматическую суммаризацию при загрузке
    auto-summarize: true

# Логирование
logging:
  level:
    root: INFO
    com.example.recorder: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
