spring:
  application:
    name: recorder-server
  
  # Конфигурация базы данных (H2 для разработки)
  datasource:
    url: jdbc:h2:file:./data/recorder-db;DB_CLOSE_ON_EXIT=FALSE;DB_CLOSE_DELAY=-1
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate  # Используем Flyway для миграций
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  
  # Flyway миграции
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# Конфигурация сервера
server:
  port: 8080
  address: 0.0.0.0

# Настройки хранилища файлов
recorder:
  storage:
    path: ./recordings
    max-file-size: 104857600  # 100MB

# Интеграция с сервисом суммаризации
summary:
  client:
    # URL сервиса суммаризации (заменить на актуальный)
    base-url: ${SUMMARY_SERVICE_URL:http://localhost:8081}
    # Таймаут запроса
    timeout: 30s
    # API ключ (если требуется)
    api-key: ${SUMMARY_API_KEY:}
    # Включить автоматическую суммаризацию при загрузке
    auto-summarize: true

# Логирование
logging:
  level:
    root: INFO
    com.example.recorder: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
