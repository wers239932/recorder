[project]
name = "asr-transcription-service"
version = "0.1.0"
description = "REST microservice for audio transcription via faster-whisper"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.17",
    "faster-whisper>=1.1.0",
]

[dependency-groups]
dev = [
    "requests>=2.32.0",
]
